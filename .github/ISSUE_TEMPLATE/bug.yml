name: Bug report
description: Something in bellhop does not work as the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check [troubleshooting](https://github.com/Adder-Analytics/tmux-bellhop/blob/main/docs/troubleshooting.md) first.
        Before you paste anything, remove names, paths and conversation titles you do not want to be public.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Include any message in the tmux status line.
      placeholder: |
        I pressed prefix i with two Claude Code panes waiting. The inbox showed only one of them.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. tmux new -s a
        2. ...
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system and version.
      placeholder: macOS 15.5 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Terminal application and version.
      placeholder: iTerm2 3.5, kitty 0.39, GNOME Terminal 3.52
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: bellhop doctor output
      description: |
        Run `bellhop doctor` inside tmux (in the session where the problem happens) and paste all of it.
        If bellhop is not on your PATH, run `~/.tmux/plugins/tmux-bellhop/bin/bellhop doctor`.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Your bellhop lines from tmux.conf, `tmux show-messages` output, or a screenshot.
    validations:
      required: false
