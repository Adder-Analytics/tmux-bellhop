# The demo server's look (tmux -L bellhop-demo, built by demo/setup.sh). It is
# sourced by the demo HOME's ~/.tmux.conf, so the server that `bellhop restore`
# starts in a tape gets it too. No clock, host name, user or real path shows.
set -g prefix C-b
set -g base-index 1
set -g escape-time 10
set -g status-style 'bg=#303030,fg=#c0c0c0'
set -g status-left '#S '
set -g status-left-length 20
set -g status-right ''
set -g set-titles off
# Every pane is a plain bash with a short prompt ("api $ "): no shell startup
# file runs, so none can print a user or host name.
set -g default-shell "$SHELL"
set -g default-command "env PS1='\\W \\$ ' bash --norc --noprofile"
# Undocumented, demo only: each bellhop key first shows " ⌨ prefix <key> ".
set -g @bellhop-demo-caption on
run-shell "$REPO/bellhop.tmux"
